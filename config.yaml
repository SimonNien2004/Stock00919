# 00919 加碼助理設定檔 —— 改這裡就好，不用動程式

symbol: "00919"
name: "群益台灣精選高息"
history_start: "2022-10-20"      # 00919 上市日（前 240 個交易日為指標暖機期）

# ---- 標的行事曆 ----
ex_months: [3, 6, 9, 12]         # 除息月份（季配）
ex_day: 17                       # 除息日約在當月中旬（僅供估算）
rebalance_months: [5, 12]        # 成分股半年度調整月份
rebalance_day: 20                # 調整生效日約在當月 20 日前後（近似）

# ---- 你的資金規劃 ----
dca:                             # 券商自動定期定額（照常扣款，不受訊號影響）；尚未設定
  days: []                       # 每月扣款日（遇休市順延），例如 [8, 18, 28]
  amount: 0                      # 每次扣款金額（元）
extra_pool:                      # 定期定額以外的加碼資金：一筆總額，用完為止；尚未設定
  total: 0                       # 總額（元）；0 = 尚未設定
  shared_with: []                # 共用資金池的其他標的，例如 ["00878", "00881"]
  start: "2026-10-26"            # 從這天起、備註含「額外加碼」的買進才從資金池扣除
  normal_pct: 0.10               # 一般加碼：每月最多動用「月初剩餘資金」的 10%
  aggressive_pct: 0.30           # 積極加碼：每月最多動用「月初剩餘資金」的 30%
monthly_budget: 0                # （舊制）每月固定的額外預算；使用 extra_pool 時保持 0
reserve: 0                       # （舊制）預備金上限；使用 extra_pool 時保持 0
reinvest_dividends: true         # 配息是否再投入 00919（只影響報告文字）

# ---- 交易成本 ----
fee_rate: 0.001425               # 券商手續費率
fee_discount: 0.6                # 手續費折扣（6 折填 0.6，沒有折扣填 1）
fee_min: 1                       # 最低手續費（零股多為 1 元，整股多為 20 元）

# ---- 訊號門檻（PRD 第 7 節）----
thresholds:
  aggressive: 75                 # 評分 ≥ 此值，且符合下面兩條件 → 積極加碼
  aggressive_max_pos120: 0.333   # 價格需位於 120 日區間下 1/3
  aggressive_min_p_up: 0.60      # 60 日上漲機率需 ≥ 60%
  pause: 50                      # 評分 < 此值「且」60 日預期中位數為負 → 暫緩加碼
  dip_pause_prob: 0.60           # 60 日內再跌 3% 機率 ≥ 此值 → 暫緩加碼

dip_pct: 0.03                    # 「再跌多少」的定義

# ---- 模型 ----
model:
  min_train_days: 400            # walk-forward 最少訓練天數（約 1.6 年；00919 2022-10 才上市）
  retrain_every: 60              # 每隔幾個交易日重新訓練一次
  train_stride: 5                # 訓練時每 5 天取一筆，降低相鄰樣本重疊造成的過度擬合

# ---- 回測 ----
backtest:
  start: "2022-01-01"            # 回測起點（若早於第一筆樣本外預測，以後者為準）
  max_idle_months: 6             # 連續幾個月沒買，就強制照定期定額投入
